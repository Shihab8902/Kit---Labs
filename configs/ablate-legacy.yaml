# Ablation A — legacy build, 8K pieces, 20M-token budget.
model:
  vocab_size: 8192
  d_model: 128
  n_layer: 4
  n_head: 4
  n_ctx: 256
  norm: layernorm
  pos: learned
  mlp: gelu
data:
  train: data/train2.bin
  val: data/val2.bin
batch:
  micro: 16
  accum: 4
  block: 256
train:
  steps: 1220
  peak_lr: 0.001
  end_lr: 0.0001
  warmup: 60
  weight_decay: 0.1
  grad_clip: 1.0
  seed: 0
